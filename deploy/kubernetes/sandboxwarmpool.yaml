# The pool the app server claims sandboxes from. Its name is the default sandbox
# spec id (see kubernetes_sandbox_spec_service.py); define more pools to offer
# users a choice of runtimes.
#
# Note: because the app server injects a per-sandbox session API key, agent-sandbox
# cold starts each pod from the template rather than handing over a pre-warmed one,
# so replicas only helps if you also set `inject_session_key: false`.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: openhands-pool
  namespace: default
spec:
  replicas: 0
  sandboxTemplateRef:
    name: openhands-agent-server
